<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Recommended meta tags -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
        <!-- Bootstrap Setup -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- External CSS -->
        <link rel="stylesheet" type="text/css" href="style.css">

        <py-config>
            packages = ["numpy", "matplotlib"]
        </py-config>

        <title>Skills Test</title>

    </head>
    <body>
        <py-script src="main.py"></py-script>

        <div class="container mt-3 mb-3">
        <form>
            <h3>10-Emerald Weekly Schedule</h3>
            <div class="mb-2">
                <label>Monday:</label>
                <input type="number" id="mon" min="0" max="25" value="0">
                <label>Tuesday:</label>
                <input type="number" id="tue" min="0" max="25" value="0">
                <label>Wednesday:</label>
                <input type="number" id="wed" min="0" max="25" value="0">
                <label>Thursday:</label>
                <input type="number" id="thu" min="0" max="25" value="0">
                <label>Friday:</label>
                <input type="number" id="fri" min="0" max="25" value="0">
            </div>
            <input type="button" class="btn btn-success" py-click="check_attendance" value="Submit">
        </form>
        </div>

        <div id="output"></div>
    </body>
</html>
